name: Build GTK3 Client

on:
  push:
    branches: [gtk3, master]
  pull_request:
    branches: [gtk3, master]

jobs:
  build-linux:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Full (sound + metaserver2)"
            cmake_flags: >-
              -DSOUND=ON
              -DMETASERVER2=ON
            apt_extra: libsdl2-mixer-dev libcurl4-openssl-dev
            upload: true

          - name: "Minimal (no optional deps)"
            cmake_flags: >-
              -DSOUND=OFF
              -DMETASERVER2=OFF
            apt_extra: ""
            upload: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            libglib2.0-dev-bin \
            libpng-dev \
            libx11-dev \
            valac \
            perl \
            ${{ matrix.apt_extra }}

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DLUA=OFF \
            ${{ matrix.cmake_flags }}

      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: Test
        # Exclude the live-network metaserver test; it is unreliable in CI.
        run: ctest --test-dir build --output-on-failure -E metaserver

      - name: Upload binary
        if: matrix.upload
        uses: actions/upload-artifact@v4
        with:
          name: crossfire-client-gtk3-linux
          path: build/gtk-v2/src/crossfire-client-gtk3
          if-no-files-found: error

  build-windows:
    name: Windows (MSYS2/UCRT64)
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-gtk3
            mingw-w64-ucrt-x86_64-libcurl
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-SDL2_mixer
            mingw-w64-ucrt-x86_64-vala
            mingw-w64-ucrt-x86_64-libpng
            mingw-w64-ucrt-x86_64-pkgconf
            perl

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DLUA=OFF \
            -DSOUND=ON \
            -DMETASERVER2=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: crossfire-client-gtk3-windows
          path: build/gtk-v2/src/crossfire-client-gtk3.exe
          if-no-files-found: error
